<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bon voyage, Lola ✈️</title>
<meta property="og:title" content="Bon voyage, Lola ✈️">
<meta property="og:description" content="Un petit mot avant ton vol…">
<meta name="theme-color" content="#1d2b64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --text:#fffaf0; --glow:255,214,150; --matcha:#8fbf6a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#1d2b64; }
  body {
    background: linear-gradient(180deg, #1d2b64 0%, #4f4a8c 28%, #b86a9c 55%, #f39a7a 76%, #ffd29a 100%);
    font-family:'Dancing Script', cursive; color:var(--text);
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #sky { position:fixed; left:0; right:0; bottom:0; width:100%; height:56vh; z-index:2; }

  /* ---------- Intro ---------- */
  #intro {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:30px; padding:0 16px; text-align:center;
    background:rgba(29,27,80,.55); transition:opacity 1.2s ease;
  }
  #intro.hide { opacity:0; pointer-events:none; }
  .intro-text { font-size:clamp(2.1rem, 9vw, 3.6rem); text-shadow:0 0 16px rgba(var(--glow),.6); animation:fadeUp 1.6s both; }
  .btn {
    font-family:'Dancing Script', cursive; font-size:1.65rem; padding:12px 34px; border-radius:999px; cursor:pointer;
    color:var(--text); background:rgba(var(--glow),.14); border:1px solid rgba(255,230,180,.65);
    transition:transform .15s, background .3s;
  }
  .btn:active { transform:scale(.95); background:rgba(var(--glow),.3); }
  .btn:disabled { opacity:.8; }
  #open { animation:fadeUp 1.6s .7s both, pulse 2.6s 2.3s infinite; }

  /* ---------- Schede ---------- */
  .card {
    position:fixed; left:50%; top:max(5vh, calc(env(safe-area-inset-top) + 12px)); z-index:5;
    width:min(440px, calc(100% - 32px)); transform:translate(-50%, 16px);
    text-align:center; padding:22px 20px 24px; border-radius:24px;
    background:rgba(36,28,84,.5); border:1px solid rgba(255,225,180,.35);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(20,10,50,.35), 0 0 30px rgba(var(--glow),.15);
    opacity:0; pointer-events:none; transition:opacity .9s ease, transform .9s ease;
  }
  .card.on { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .card.bare { background:none; border:none; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .card h2 { font-size:clamp(2rem, 8.5vw, 2.8rem); font-weight:700; line-height:1.15; text-shadow:0 0 18px rgba(var(--glow),.6); }
  .card p { font-size:clamp(1.35rem, 5.6vw, 1.9rem); line-height:1.3; margin-top:10px; text-shadow:0 1px 10px rgba(40,20,80,.6); }
  .card .small { font-family:'Quicksand', sans-serif; font-size:1rem; opacity:.9; margin-top:14px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px; }

  #lines { position:relative; min-height:6.6em; }
  #lines p { position:absolute; left:0; right:0; top:0; margin:0; opacity:0; transform:translateY(14px); transition:opacity 1.3s ease, transform 1.3s ease; }
  #lines p.on { opacity:1; transform:none; }

  /* ---------- Scena ---------- */
  .wave, .leaf { transform-box:fill-box; }
  .cloud { animation:cloud var(--t) linear var(--dl) infinite; }
  .wave { transform-origin:50% 100%; animation:wave .5s ease-in-out infinite alternate; }
  .shimmer { animation:shimmer var(--t) ease-in-out var(--dl) infinite alternate; }
  .win { animation:twinkle var(--t) ease-in-out var(--dl) infinite; }
  .leaf { transform-origin:50% 50%; animation:leaf var(--t) linear var(--dl) infinite; }
  @keyframes cloud   { from { transform:translateX(-140px); } to { transform:translateX(520px); } }
  @keyframes wave    { from { transform:rotate(-18deg); } to { transform:rotate(18deg); } }
  @keyframes shimmer { from { opacity:.2; transform:translateX(-3px); } to { opacity:.8; transform:translateX(3px); } }
  @keyframes leaf    { from { transform:translate(0,0) rotate(0); opacity:0; } 15% { opacity:1; } to { transform:translate(-40px,80px) rotate(320deg); opacity:0; } }

  /* ---------- Atmosfera ---------- */
  .star { position:fixed; width:2px; height:2px; border-radius:50%; background:#fff; z-index:1; animation:twinkle var(--t) ease-in-out var(--dl) infinite; }
  @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:.95; } }
  .sparkle { position:fixed; z-index:6; pointer-events:none; font-size:var(--s); color:var(--c); animation:burst 1.2s ease-out forwards; }
  @keyframes burst { from { transform:translate(-50%,-50%) scale(.4); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity:0; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes pulse  { 0%,100% { box-shadow:0 0 0 0 rgba(var(--glow),.45); } 50% { box-shadow:0 0 0 14px rgba(var(--glow),0); } }
</style>
</head>
<body>

<div id="intro">
  <p class="intro-text">Lola, un petit mot avant ton vol…</p>
  <button id="open" class="btn">Ouvrir ✨</button>
</div>

<svg id="sky" viewBox="0 0 360 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

<!-- 1. Frasi -->
<section class="card bare" id="c-lines"><div id="lines"></div></section>

<!-- 2. Fine -->
<section class="card" id="c-end">
  <h2>Bon voyage, Lola ✈️🍁</h2>
  <p>Fais un bon vol et profite bien de Montréal.</p>
  <p class="small">À la semaine prochaine 🙂</p>
  <div class="row"><button class="btn" id="thanks">Merci 😊</button></div>
</section>

<script>
  /* ====== PERSONALIZZA QUI ====== */
  const FRASI = [
    "Coucou Lola ✨",
    "Pour une fois, c'est toi qui décolles de CDG 😄",
    "Je te souhaite un très bon voyage à Montréal ✈️🍁",
    "Profite bien de ces trois jours avec ton père.",
    "Et au passage… félicitations pour ton diplôme ! 🎓 Bravo, c'est bien mérité.",
    "J'ai hâte de te rencontrer la semaine prochaine…",
    "…peut-être autour d'un bon matcha ? 🍵😊",
  ];
  const durata = t => Math.max(3.2, 2.2 + t.length * .045);
  // Notifica sul telefono quando Lola tocca "Merci" (app "ntfy", iscriviti a questo topic). Lascia "" per disattivarla.
  const NTFY_TOPIC = "lola-bv-4n8w2q7z";
  /* ============================== */

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $('sky');
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const CONFETTI = ['#8fbf6a', '#ffd27a', '#ffffff', '#ff9fb5', '#9fb2ff'];

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function notify(text) {
    if (!NTFY_TOPIC) return;
    fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: text, headers: { Title: 'Lola a repondu', Tags: 'airplane' } }).catch(() => {});
  }

  /* ---------- Schede ---------- */
  let current = null;
  function show(id) {
    if (current) current.classList.remove('on');
    current = $(id);
    current.classList.add('on');
  }

  const linesBox = $('lines');
  const lineEls = FRASI.map(t => {
    const p = document.createElement('p');
    p.textContent = t;
    linesBox.appendChild(p);
    return p;
  });

  function playLines(done) {
    show('c-lines');
    let t = .6;
    lineEls.forEach((p, i) => {
      setTimeout(() => {
        if (i > 0) lineEls[i - 1].classList.remove('on');
        p.classList.add('on');
        if (i === 4) burstAll();  // coriandoli per il diploma
      }, t * 1000);
      t += durata(FRASI[i]);
    });
    setTimeout(done, t * 1000);
  }

  $('thanks').addEventListener('click', () => {
    notify('Bon voyage : Lola a dit merci 😊');
    $('thanks').textContent = 'À très vite ✨';
    $('thanks').disabled = true;
    burstAll();
  });

  /* ---------- Scena: Parigi → Atlantico → Montréal ---------- */
  const W = 360, H = 320, SEA = 262;
  const SILH = '#3a2c5e', SILH2 = '#2c2150';
  // traiettoria dell'aereo (curva quadratica)
  const P0 = [20, 232], P1 = [180, 30], P2 = [345, 226];
  const bez = (t, i) => (1 - t) * (1 - t) * P0[i] + 2 * (1 - t) * t * P1[i] + t * t * P2[i];
  const bezD = (t, i) => 2 * (1 - t) * (P1[i] - P0[i]) + 2 * t * (P2[i] - P1[i]);

  function defs() {
    const d = el('defs', {}, svg);
    const sg = el('radialGradient', { id: 'sun' }, d);
    el('stop', { offset: '0%', 'stop-color': '#fff4d0' }, sg);
    el('stop', { offset: '55%', 'stop-color': '#ffd08a' }, sg);
    el('stop', { offset: '100%', 'stop-color': '#ffb070', 'stop-opacity': 0 }, sg);
    const sea = el('linearGradient', { id: 'sea', x1: 0, y1: 0, x2: 0, y2: 1 }, d);
    el('stop', { offset: '0%', 'stop-color': '#e98f86' }, sea);
    el('stop', { offset: '100%', 'stop-color': '#4a3a7a' }, sea);
    const gl = el('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, d);
    el('feGaussianBlur', { stdDeviation: 2, result: 'b' }, gl);
    const m = el('feMerge', {}, gl);
    el('feMergeNode', { in: 'b' }, m);
    el('feMergeNode', { in: 'SourceGraphic' }, m);
  }

  function sunAndSea() {
    el('circle', { cx: 180, cy: SEA, r: 70, fill: 'url(#sun)', opacity: .9 }, svg);
    el('circle', { cx: 180, cy: SEA, r: 24, fill: '#fff1c8' }, svg);
    el('rect', { x: -80, y: SEA, width: W + 160, height: H - SEA, fill: 'url(#sea)' }, svg);
    const g = el('g', {}, svg);
    for (let i = 0; i < 30; i++) {
      const y = rand(SEA + 3, H - 4), spread = (y - SEA) * 1.4 + 14;
      el('rect', {
        class: 'shimmer', x: 180 + rand(-spread, spread), y, width: rand(8, 20), height: 1.4, rx: .7,
        fill: pick(['#fff1c8', '#ffd08a', '#ffe7d6']), style: `--t:${rand(1.5, 3).toFixed(1)}s;--dl:${rand(0, 2).toFixed(1)}s`
      }, g);
    }
  }

  function clouds() {
    const g = el('g', {}, svg);
    for (let i = 0; i < 6; i++) {
      const c = el('g', { class: 'cloud', style: `--t:${rand(40, 70).toFixed(0)}s;--dl:${(-rand(0, 60)).toFixed(0)}s` }, g);
      const x = rand(-100, 0), y = rand(40, 200), s = rand(.6, 1.3);
      [[0, 0, 16, 7], [12, -5, 13, 8], [24, 0, 15, 6], [10, 3, 20, 5]].forEach(([dx, dy, rx, ry]) =>
        el('ellipse', { cx: x + dx * s, cy: y + dy * s, rx: rx * s, ry: ry * s, fill: '#fff3ea', opacity: .45 }, c));
    }
  }

  // Parigi a sinistra: tetti e Tour Eiffel in controluce
  function paris() {
    const g = el('g', {}, svg);
    el('path', { d: `M-80,${SEA + 8} L80,${SEA + 8} Q95,${SEA + 10} 100,${H} L-80,${H} Z`, fill: SILH2 }, g);
    let x = -80;
    while (x < 78) {
      const w = rand(12, 20), h = rand(14, 30), top = SEA + 8 - h;
      el('path', { d: `M${x},${SEA + 8} L${x},${top} L${x + 3},${top - 5} L${x + w - 3},${top - 5} L${x + w},${top} L${x + w},${SEA + 8} Z`, fill: SILH }, g);
      for (let fx = x + 3; fx < x + w - 3; fx += 5)
        if (Math.random() < .35) el('rect', { class: 'win', x: fx, y: top + rand(3, h - 6), width: 2, height: 3, fill: '#ffd27a', style: `--t:${rand(4, 8).toFixed(1)}s;--dl:${rand(0, 4).toFixed(1)}s` }, g);
      x += w;
    }
    const t = el('g', { transform: `translate(38,${SEA + 8}) scale(.42)` }, g);
    el('path', { d: "M-1.5,-300 L1.5,-300 L1.5,-282 L4,-280 L4,-270 L6,-268 L14,-180 L20,-180 L20,-172 L16,-172 L30,-120 L42,-120 L42,-110 L36,-110 L62,0 L44,0 C40,-40 20,-60 0,-60 C-20,-60 -40,-40 -44,0 L-62,0 L-36,-110 L-42,-110 L-42,-120 L-30,-120 L-16,-172 L-20,-172 L-20,-180 L-14,-180 L-6,-268 L-4,-270 L-4,-280 L-1.5,-282 Z", fill: SILH }, t);
    el('circle', { cx: 0, cy: -300, r: 5, fill: '#ffe7a3', filter: 'url(#glow)' }, t);
  }

  // Montréal a destra: Mont Royal con la croce, grattacieli e la Biosphère
  function montreal() {
    const g = el('g', {}, svg);
    el('path', { d: `M250,${SEA + 2} Q300,${SEA - 40} 380,${SEA - 26} L440,${SEA + 2} Z`, fill: '#4a3870' }, g);
    el('path', { d: `M330,${SEA - 34} l0,-14 M325,${SEA - 44} l10,0`, stroke: '#fff1c8', 'stroke-width': 1.6, filter: 'url(#glow)' }, g);
    el('path', { d: `M262,${SEA + 8} L262,${SEA} L440,${SEA} L440,${H} L280,${H} Q266,${SEA + 14} 262,${SEA + 8} Z`, fill: SILH2 }, g);
    [[272, 30], [284, 52], [298, 40], [310, 64], [324, 46], [338, 58], [352, 36], [366, 50]].forEach(([x, h], i) => {
      const w = i % 2 ? 11 : 13, top = SEA - h;
      el('rect', { x, y: top, width: w, height: h + 2, fill: SILH }, g);
      if (i === 3) el('path', { d: `M${x},${top} L${x + w / 2},${top - 8} L${x + w},${top}`, fill: SILH }, g);
      for (let fy = top + 4; fy < SEA - 3; fy += 5)
        for (let fx = x + 2; fx < x + w - 2; fx += 4)
          if (Math.random() < .3) el('rect', { class: 'win', x: fx, y: fy, width: 1.8, height: 2.4, fill: '#ffd27a', style: `--t:${rand(4, 8).toFixed(1)}s;--dl:${rand(0, 4).toFixed(1)}s` }, g);
    });
    // la Biosphère, cupola geodetica sull'acqua
    const b = el('g', { transform: `translate(258,${SEA + 4})` }, g);
    el('path', { d: 'M-14,0 A14,14 0 0,1 14,0 Z', fill: 'none', stroke: '#c9b6e6', 'stroke-width': 1 }, b);
    for (let i = 1; i < 6; i++) el('line', { x1: -14 + i * 4.7, y1: 0, x2: 0, y2: -14, stroke: '#c9b6e6', 'stroke-width': .5, opacity: .7 }, b);
    [-4, -8, -11].forEach(y => { const r = Math.sqrt(196 - y * y); el('line', { x1: -r, y1: y, x2: r, y2: y, stroke: '#c9b6e6', 'stroke-width': .5, opacity: .7 }, b); });
    // foglie d'acero che cadono
    for (let i = 0; i < 5; i++) {
      const l = el('text', { class: 'leaf', x: rand(280, 360), y: rand(150, 200), 'font-size': rand(8, 12), style: `--t:${rand(5, 8).toFixed(1)}s;--dl:${(-rand(0, 8)).toFixed(1)}s` }, g);
      l.textContent = '🍁';
    }
  }

  /* ---------- L'aereo, con Lola al finestrino ---------- */
  let plane;
  function airplane() {
    // scia tratteggiata della rotta
    el('path', { d: `M${P0} Q${P1} ${P2}`, fill: 'none', stroke: '#fff7ea', 'stroke-width': 1.2, 'stroke-dasharray': '3 6', opacity: .55 }, svg);
    plane = el('g', {}, svg);
    const p = el('g', { transform: 'scale(1.5)' }, plane);
    const MATCHA = '#8fbf6a';
    el('path', { d: 'M-34,-6 L-44,-22 L-36,-22 L-22,-6 Z', fill: MATCHA }, p);
    el('path', { d: 'M-2,1 L-18,-12 L-10,-12 L10,1 Z', fill: '#c9cfe0' }, p);
    el('path', { d: 'M-38,-5 Q-41,0 -36,5 L28,6 Q42,5 44,0 Q41,-7 28,-7 L-30,-7 Z', fill: '#f8f8fc' }, p);
    el('path', { d: 'M-36,2 L36,3 Q42,3 44,0 Q42,4 28,6 L-36,5 Z', fill: '#d9dcea' }, p);
    el('rect', { x: -34, y: 1, width: 70, height: 1.4, fill: MATCHA }, p);
    for (let x = -26; x < 26; x += 5) if (x < 4 || x > 14) el('circle', { cx: x, cy: -2.5, r: 1.3, fill: '#7d9cc9' }, p);
    el('path', { d: 'M34,-5 Q39,-5 41,-2 L35,-2 Z', fill: '#4a5a8a' }, p);
    // finestrino di Lola, ingrandito: capelli castano-biondi ricci
    const wx = 9;
    el('rect', { x: wx - 5, y: -6.5, width: 10, height: 9, rx: 3, fill: '#ffeacc', stroke: '#c9cfe0', 'stroke-width': .6 }, p);
    [[-2.6, -3.4], [0, -4.4], [2.6, -3.4], [-3.2, -1], [3.2, -1], [-3, 1.2], [3, 1.2]].forEach(([dx, dy]) =>
      el('circle', { cx: wx + dx, cy: dy, r: 1.5, fill: pick(['#c9995e', '#d9b07a', '#b8864e']) }, p));
    el('circle', { cx: wx, cy: -1.4, r: 2.1, fill: '#f2c9a8' }, p);
    el('path', { d: `M${wx - .7},-.6 q.7,.6 1.4,0`, stroke: '#a0524a', 'stroke-width': .35, fill: 'none' }, p);
    const hand = el('g', { class: 'wave' }, p);
    el('line', { x1: wx + 3.5, y1: 2, x2: wx + 4.2, y2: -3.2, stroke: '#f2c9a8', 'stroke-width': 1, 'stroke-linecap': 'round' }, hand);
    el('circle', { cx: 44, cy: 0, r: 1, fill: '#fff6d0', filter: 'url(#glow)' }, p);
  }

  const FLIGHT = 13000;
  function fly(now) {
    const t = (now % FLIGHT) / FLIGHT;
    const x = bez(t, 0), y = bez(t, 1);
    const ang = Math.atan2(bezD(t, 1), bezD(t, 0)) * 180 / Math.PI;
    plane.setAttribute('transform', `translate(${x},${y}) rotate(${ang})`);
    plane.setAttribute('opacity', Math.min(1, t * 12, (1 - t) * 12));
    requestAnimationFrame(fly);
  }

  function build() {
    svg.innerHTML = '';
    defs();
    sunAndSea();
    clouds();
    paris();
    montreal();
    airplane();
  }

  /* ---------- Atmosfera ---------- */
  function ambience() {
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `left:${rand(0, 100)}vw;top:${rand(0, 28)}vh;--t:${rand(2, 5)}s;--dl:${rand(0, 4)}s`;
      document.body.appendChild(s);
    }
  }

  function sparkles(x, y, n = 8) {
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div');
      h.className = 'sparkle';
      h.textContent = pick(['✦', '▪', '●']);
      const a = (i / n) * Math.PI * 2 + rand(-.3, .3), dist = rand(40, 110);
      h.style.cssText = `left:${x}px;top:${y}px;--s:${rand(10, 20)}px;--c:${pick(CONFETTI)};--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist}px;--r:${rand(-200, 200)}deg`;
      h.addEventListener('animationend', () => h.remove());
      document.body.appendChild(h);
    }
  }
  const burstAll = () => [0, 250, 500].forEach(d => setTimeout(() => sparkles(rand(.2, .8) * innerWidth, rand(.15, .45) * innerHeight, 10), d));

  /* ---------- Avvio ---------- */
  ambience();
  build();
  requestAnimationFrame(fly);
  let started = false;

  $('open').addEventListener('click', () => {
    $('intro').classList.add('hide');
    started = true;
    playLines(() => show('c-end'));
  });

  document.addEventListener('pointerdown', e => { if (started && !e.target.closest('button')) sparkles(e.clientX, e.clientY); });
</script>
</body>
</html>
